name: Qanas Borrow Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: qanas-borrow-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Start borrow sync
        run: |
          curl --fail --retry 5 --retry-delay 10 --max-time 120 \
            https://qnaa9.onrender.com/api/sync/borrow/all

      - name: Wait for completion
        run: |
          sleep 10

          for i in {1..50}; do
            OUT=$(curl --fail --retry 3 --max-time 60 \
              https://qnaa9.onrender.com/api/sync/borrow/status)

            echo "$OUT"

            if echo "$OUT" | grep -q '"running":false'; then
              exit 0
            fi

            sleep 30
          done

          exit 1
