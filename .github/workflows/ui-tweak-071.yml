name: UI tweak 0.7.1

on:
  push:
    paths:
      - '.github/workflows/ui-tweak-071.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update filter labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/main.py')
          s=p.read_text()
          s=s.replace('<button class="f" onclick="sf(\'scarce\',this)">Available</button><button class="f" onclick="sf(\'near\',this)">قرب القاع</button>', '<button class="f" onclick="sf(\'scarce\',this)">Available ≤10,000</button>')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "qanas-bot"
          git config user.email "qanas-bot@users.noreply.github.com"
          git add app/main.py
          git diff --cached --quiet || git commit -m "Clean up top filters"
          git push
